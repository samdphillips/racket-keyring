on:
  push:
  pull_request_target:
    branches:
      - main
  schedule:
  - cron: "17 16 * * FRI"
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLTSTDERR: fatal@keyring
    steps:
    - name: checkout
      uses: actions/checkout@master
    - name: install racket
      uses: Bogdanp/setup-racket@v1.15
      with:
        architecture: 'x64'
        distribution: 'full'
        variant: "BC"
        version: "8.17"
    - name: install base package
      run: raco pkg install --batch --auto ./keyring-lib ./keyring-test ./keyring
    - name: check dependencies
      run: raco setup --check-pkg-deps --unused-pkg-deps --pkgs keyring-lib keyring-test keyring
    - name: run base tests
      run: raco test --drdr --package keyring-test
